name: Claude

# On-demand pull request review. Nothing runs until someone with write access
# mentions @claude in a pull request comment, for example:
#
#   gh pr comment 12 --body "@claude review this PR"
#
# GitHub runs comment-triggered workflows from the default branch only, so a
# change to this file takes effect after it merges.
#
# Claude authenticates with the CLAUDE_CODE_OAUTH_TOKEN secret, made with
# `claude setup-token`, so runs draw on the owner's Claude subscription rather
# than API billing. It talks to GitHub with this workflow's GITHUB_TOKEN instead
# of the Claude GitHub App, which makes the permissions below the whole grant:
# it can reply and post inline review comments, and it cannot push.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: parhelion-optiplex
    # The pool runs one job at a time, so a stalled review would hold CI behind it.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The action's own prompt says how to read the PR but not what to look
          # for. The appended prompt makes every run a reviewer with a fixed bar.
          # Without --model the action uses Sonnet; reviews get Opus at high effort.
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Review this pull request. Report only problems worth fixing: bugs, regressions, security issues, data loss, races, and missing or wrong tests. Check the change against the rules in CLAUDE.md and AGENTS.md. Skip style nits and anything CI already catches. Post each finding as an inline comment on the line, with a severity (blocker, should-fix, or nit) and a concrete fix. End with one summary comment that lists the findings or says there are none. On a re-review, first check whether earlier findings were fixed."
