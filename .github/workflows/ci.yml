name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check formatting
        run: swift format lint --strict --recursive Package.swift Sources Tests Examples

  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}-noble
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3", "6.4"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test --skip-build
      - name: Run example
        run: swift run HelloParhelion
