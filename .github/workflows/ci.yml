name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check formatting
        run: >-
          swift format lint --strict --recursive
          Package.swift Sources Tests Examples
          Tools/parhelion-cli/Package.swift Tools/parhelion-cli/Sources
          Tools/parhelion-cli/Tests Tools/parhelion-cli/Fixtures
      - name: Check the embedded fonts
        run: |
          Scripts/embed-font.sh Fonts/Inter-Regular.ttf | diff -q - Sources/ParhelionRender/InterRegularFontData.swift
          Scripts/embed-font.sh Fonts/Inter-SemiBold.ttf | diff -q - Sources/ParhelionRender/InterSemiBoldFontData.swift
      - name: Check that no target declares resources
        # See docs/adr/0003-no-swiftpm-resources.md.
        run: "! grep -nE '^[[:space:]]*resources:' Package.swift"

  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}-noble
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3", "6.4"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test --skip-build
      - name: Run example
        run: swift run HelloParhelion
      - name: Check the README screenshot
        # Rendering is deterministic, so the image in the README must match a
        # fresh render. After an intended rendering change, regenerate it with
        # `swift run Counter --png docs/images/counter.png`.
        run: |
          swift run Counter --png "$RUNNER_TEMP/counter.png"
          cmp "$RUNNER_TEMP/counter.png" docs/images/counter.png

  window-host:
    name: Window host (Swift 6.4)
    runs-on: ubuntu-latest
    # SDL3 is packaged for Ubuntu 26.04 but not 24.04; see docs/adr/0004-pure-swift-renderer.md.
    container: swift:6.4-resolute
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install SDL3 and Python
        run: apt-get update && apt-get install -y --no-install-recommends libsdl3-dev python3
      - name: Build the parhelion tool
        run: swift build --package-path Tools/parhelion-cli --build-tests -Xswiftc -warnings-as-errors
      - name: Test the parhelion tool
        run: swift test --package-path Tools/parhelion-cli --skip-build
      - name: Build the example app
        run: swift build --product Counter
      - name: Preview the example without a display
        env:
          SDL_VIDEODRIVER: offscreen
        run: >-
          Tools/parhelion-cli/.build/debug/parhelion preview --exit-after-first-frame
          .build/debug/Counter
      - name: Run an executable app without a display
        env:
          SDL_VIDEODRIVER: offscreen
        run: >-
          Tools/parhelion-cli/.build/debug/parhelion run --exit-after-first-frame
          --product Counter
      - name: Run the scrolling example without a display
        env:
          SDL_VIDEODRIVER: offscreen
        run: >-
          Tools/parhelion-cli/.build/debug/parhelion run --exit-after-first-frame
          --product Scrolling
      - name: Run the form example without a display
        env:
          SDL_VIDEODRIVER: offscreen
        run: >-
          Tools/parhelion-cli/.build/debug/parhelion run --exit-after-first-frame
          --product Form
      - name: Run the tasks example on another device without a display
        env:
          SDL_VIDEODRIVER: offscreen
        run: >-
          Tools/parhelion-cli/.build/debug/parhelion run --exit-after-first-frame
          --product Tasks --device "iPhone 16e"
      - name: Run an xtool-shaped app without a display
        env:
          SDL_VIDEODRIVER: offscreen
        run: >-
          Tools/parhelion-cli/.build/debug/parhelion run --exit-after-first-frame
          --package-path Tools/parhelion-cli/Fixtures/LibraryApp
      - name: Drive an app as an agent over MCP
        env:
          SDL_VIDEODRIVER: offscreen
        run: Scripts/mcp-session.py Tools/parhelion-cli/.build/debug/parhelion
