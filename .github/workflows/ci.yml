name: CI

# Pull requests only. Branch protection requires a branch to be up to date with
# main before it merges, so the last run on a pull request already tested the
# exact tree that lands, and a second run on main would repeat it.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on a self-hosted pool: one disposable container per job, one job
# at a time. Its image is Debian 13 with SDL3, python3, and the Swift 6.3 and 6.4
# toolchains under /opt/swift/<version>. No Swift is on PATH until a job selects
# one.
#
# Each job's first step refuses pull requests from forks, before checkout, so
# that code from outside the repository never runs on the pool. It fails the
# required check instead of skipping the job, because branch protection treats
# a skipped required check as passed.
jobs:
  lint:
    name: Lint
    runs-on: parhelion-optiplex
    timeout-minutes: 15
    steps:
      - name: Refuse pull requests from forks
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Pull requests from forks do not run on the self-hosted runners."
          exit 1
      - name: Select Swift 6.4
        run: echo /opt/swift/6.4/usr/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check formatting
        run: >-
          swift format lint --strict --recursive
          Package.swift Sources Tests Examples
          Tools/parhelion-cli/Package.swift Tools/parhelion-cli/Sources
          Tools/parhelion-cli/Tests Tools/parhelion-cli/Fixtures
      - name: Check the embedded fonts
        run: |
          Scripts/embed-font.sh Fonts/Inter-Regular.ttf | diff -q - Sources/ParhelionRender/InterRegularFontData.swift
          Scripts/embed-font.sh Fonts/Inter-Medium.ttf | diff -q - Sources/ParhelionRender/InterMediumFontData.swift
          Scripts/embed-font.sh Fonts/Inter-SemiBold.ttf | diff -q - Sources/ParhelionRender/InterSemiBoldFontData.swift
          Scripts/embed-font.sh Fonts/Inter-Bold.ttf | diff -q - Sources/ParhelionRender/InterBoldFontData.swift
      - name: Check that no target declares resources
        # See docs/adr/0003-no-swiftpm-resources.md.
        run: "! grep -nE '^[[:space:]]*resources:' Package.swift"

  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: parhelion-optiplex
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3", "6.4"]
    steps:
      - name: Refuse pull requests from forks
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Pull requests from forks do not run on the self-hosted runners."
          exit 1
      - name: Select Swift ${{ matrix.swift }}
        run: echo "/opt/swift/${{ matrix.swift }}/usr/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test --skip-build
      - name: Run example
        run: swift run HelloParhelion
      - name: Check the README screenshot
        # Rendering is deterministic, so the image in the README must match a
        # fresh render. After an intended rendering change, regenerate it with
        # `swift run Counter --png docs/images/counter.png`. `swift test` checks the
        # Tasks, Tabs, dark, and Dynamic Type images in the README the same way;
        # regenerate them with
        # `PARHELION_README_IMAGES=docs/images swift test --filter 'write.*ReadmeImages'`.
        run: |
          swift run Counter --png "$RUNNER_TEMP/counter.png"
          cmp "$RUNNER_TEMP/counter.png" docs/images/counter.png

  window-host:
    name: Window host (Swift 6.4)
    runs-on: parhelion-optiplex
    timeout-minutes: 30
    steps:
      - name: Refuse pull requests from forks
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Pull requests from forks do not run on the self-hosted runners."
          exit 1
      - name: Select Swift 6.4
        run: echo /opt/swift/6.4/usr/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the parhelion tool
        run: swift build --package-path Tools/parhelion-cli --build-tests -Xswiftc -warnings-as-errors
      - name: Test the parhelion tool
        run: swift test --package-path Tools/parhelion-cli --skip-build
      - name: Build the example app
        run: swift build --product Counter
      - name: Preview the example without a display
        env:
          SDL_VIDEODRIVER: offscreen
        run: >-
          Tools/parhelion-cli/.build/debug/parhelion preview --exit-after-first-frame
          .build/debug/Counter
      - name: Run an executable app without a display
        env:
          SDL_VIDEODRIVER: offscreen
        run: >-
          Tools/parhelion-cli/.build/debug/parhelion run --exit-after-first-frame
          --product Counter
      - name: Run the scrolling example without a display
        env:
          SDL_VIDEODRIVER: offscreen
        run: >-
          Tools/parhelion-cli/.build/debug/parhelion run --exit-after-first-frame
          --product Scrolling
      - name: Run the form example without a display
        env:
          SDL_VIDEODRIVER: offscreen
        run: >-
          Tools/parhelion-cli/.build/debug/parhelion run --exit-after-first-frame
          --product Form
      - name: Run the tasks example on another device without a display
        env:
          SDL_VIDEODRIVER: offscreen
        run: >-
          Tools/parhelion-cli/.build/debug/parhelion run --exit-after-first-frame
          --product Tasks --device "iPhone 16e"
      - name: Run an xtool-shaped app without a display
        env:
          SDL_VIDEODRIVER: offscreen
        run: >-
          Tools/parhelion-cli/.build/debug/parhelion run --exit-after-first-frame
          --package-path Tools/parhelion-cli/Fixtures/LibraryApp
      - name: Drive an app as an agent over MCP
        env:
          SDL_VIDEODRIVER: offscreen
        run: Scripts/mcp-session.py Tools/parhelion-cli/.build/debug/parhelion
