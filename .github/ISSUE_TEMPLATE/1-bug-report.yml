name: Bug report
description: Something in Parhelion behaves differently from SwiftUI, crashes, or fails to build.
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest view that shows the problem, and how you drove it.
      render: swift
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: "The output of `host.root.outline(includeIDs: true)`, or the full error."
      render: text
  - type: input
    id: version
    attributes:
      label: Parhelion version
      description: A release tag or a commit hash.
      placeholder: e.g. 0.1.0 or 1a2b3c4
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and Swift version
      description: The output of `uname -srm` and `swift --version`.
      placeholder: e.g. Linux 6.17 x86_64, Swift 6.4.1
    validations:
      required: true
